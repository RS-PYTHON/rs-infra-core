apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kube-api
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kube-api
  httpUpgrade:
    - type: "spdy/3.1"
    - type: "websocket"
  # without this, you might want to better disable HTTP/2 when running kubectl exec
  # GODEBUG=http2client=0 kubectl exec
  useClientProtocol: true
