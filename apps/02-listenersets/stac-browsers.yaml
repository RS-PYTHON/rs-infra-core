apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: stac-browser-auxip
  namespace: processing
  annotations:
    cert-manager.io/cluster-issuer: "{{ cluster_issuer }}"
spec:
  parentRef:
    name: envoy
    namespace: envoy-gateway
    group: gateway.networking.k8s.io
    kind: Gateway
  listeners:
  - name: https
    hostname: stac-browser-auxip.{{ platform_domain_name }}
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: stac-browser-auxip-{{ platform_domain_name | replace(".", "-") }}
        kind: Secret
---
